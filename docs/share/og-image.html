<!DOCTYPE html>
<!-- Source for assets/og-image.png (the link preview image). Rendered at 1200x630
     with: node docs/share/render.js -->
<html lang="ta-SG"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&family=Tiro+Tamil&family=Noto+Sans+Tamil:wght@500;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0D1B2A;color:#F0EDE6;font-family:'Inter',sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(520px 380px at 92% 8%,rgba(0,201,177,.20),transparent 70%),
  radial-gradient(560px 420px at 0% 100%,rgba(245,184,0,.14),transparent 70%)}
.wrap{position:absolute;inset:0;padding:58px 64px;display:flex;gap:48px}
.left{flex:1;display:flex;flex-direction:column}
.brand{font-size:26px;font-weight:700;color:#F5B800;letter-spacing:-.01em}
.brand span{color:#F0EDE6;font-weight:500}
.kicker{margin-top:34px;display:inline-block;align-self:flex-start;font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#00C9B1;border:1.5px solid rgba(0,201,177,.5);padding:8px 14px;border-radius:999px}
h1{margin-top:22px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:68px;line-height:1.02;letter-spacing:-.01em}
h1 em{color:#F5B800;font-style:italic}
.ta{margin-top:16px;font-family:'Tiro Tamil',serif;font-size:25px;color:#A8B8C8}
.stats{margin-top:auto;display:flex;gap:34px;align-items:flex-end}
.stat b{display:block;font-size:40px;font-weight:800;color:#F0EDE6;letter-spacing:-.02em}
.stat small{font-size:16px;color:#A8B8C8;font-weight:500}
.cta{margin-left:auto;background:#F5B800;color:#0D1B2A;font-weight:800;font-size:22px;padding:16px 26px;border-radius:14px;white-space:nowrap}
.right{width:380px;display:flex;align-items:center}
.card{width:100%;background:#1A2E42;border:1px solid #2A4060;border-radius:22px;padding:28px 28px 26px;box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(2deg)}
.tag{font-size:13px;font-weight:700;letter-spacing:.08em;color:#00C9B1;text-transform:uppercase}
.q{margin-top:14px;font-family:'Noto Sans Tamil',sans-serif;font-weight:500;font-size:23px;line-height:1.5;white-space:nowrap}
.q u{text-decoration:none;padding:0 1px;border-bottom:3px solid #F5B800;text-align:center;color:#F5B800}
.opts{margin-top:18px;display:flex;gap:10px}
.opt{flex:1;text-align:center;font-family:'Noto Sans Tamil',sans-serif;font-weight:700;font-size:28px;padding:10px 0;border-radius:12px;background:#1F3550;border:1.5px solid #2A4060}
.opt.ok{background:rgba(82,227,161,.14);border-color:#52E3A1;color:#52E3A1}
.conf{margin-top:20px;font-size:15px;color:#A8B8C8;font-weight:600}
.cbtn{margin-top:10px;display:flex;gap:10px}
.cbtn div{flex:1;text-align:center;font-size:16px;font-weight:700;padding:10px 0;border-radius:10px;border:1.5px solid #2A4060;color:#F0EDE6}
.cbtn .on{border-color:#F5B800;color:#F5B800;background:rgba(245,184,0,.1)}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="left">
    <div class="brand">⚡ Synapse <span>Tamil</span></div>
    <div class="kicker">Upper primary · Learn for fun</div>
    <h1>Tamil that feels like <em>play</em>, and stays in memory</h1>
    <div class="ta">மூளை விஞ்ஞானத்துடன் தமிழ் கற்போம்</div>
    <div class="stats">
      <div class="stat"><b>850+</b><small>bite-sized challenges</small></div>
      <div class="stat"><b>5</b><small>topics to explore</small></div>
      <div class="cta">Try it together →</div>
    </div>
  </div>
  <div class="right">
    <div class="card">
      <div class="tag">ஒலி வேறுபாடு · Sound pairs</div>
      <div class="q">வாழைப்ப<u>ழ</u>ம் சாப்பிட்டேன்.</div>
      <div class="opts"><div class="opt">ல</div><div class="opt">ள</div><div class="opt ok">ழ</div></div>
      <div class="conf">Knew it, or a lucky guess?</div>
      <div class="cbtn"><div class="on">I knew it</div><div>I guessed</div></div>
    </div>
  </div>
</div>
</body></html>
